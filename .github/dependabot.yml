version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      rust-crypto:
        patterns: ["argon2", "chacha20poly1305", "hkdf", "hpke", "sha2", "zeroize"]
