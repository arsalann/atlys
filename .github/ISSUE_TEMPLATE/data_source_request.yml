name: Data source request
description: Ask for a new collector, connector, or export importer.
labels: [data-source]
body:
  - type: input
    id: source
    attributes:
      label: Source
      description: The app, service, device, or OS framework.
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: How can the data be obtained?
      options:
        - On-device API (HealthKit, Core Location, ...)
        - Official API
        - Official data export (takeout)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: What data would it provide?
      description: Describe the record types. Use synthetic examples only.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Terms of service, platform limits, or other notes
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue contains no real personal data and no secrets.
          required: true
