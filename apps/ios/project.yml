# XcodeGen spec for Atlys.xcodeproj. Edit this file, not the .xcodeproj:
#   cd apps/ios && xcodegen generate
# CI fails if the committed project is out of date with this spec.
name: Atlys
options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  AtlysCore:
    path: Packages/AtlysCore
  AtlysCollectors:
    path: Packages/AtlysCollectors
  AtlysUI:
    path: Packages/AtlysUI
targets:
  Atlys:
    type: application
    platform: iOS
    sources: [Atlys]
    info:
      path: Atlys/Info.plist
      properties:
        CFBundleDisplayName: Atlys
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Face ID unlocks your vault without typing your master password.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATLYS_BUNDLE_ID_PREFIX).app
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: AtlysCore
      - package: AtlysCollectors
      - package: AtlysUI
  AtlysTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AtlysTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATLYS_BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Atlys
      - package: AtlysCore
  AtlysUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AtlysUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATLYS_BUNDLE_ID_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Atlys
  # Throwaway M0 spike app (apps/ios/Spike/README.md). Kept as the device test
  # tool until the M0 device phase is done, then deleted.
  AtlysSpike:
    type: application
    platform: iOS
    sources: [Spike/AtlysSpike]
    entitlements:
      path: Spike/AtlysSpike/AtlysSpike.entitlements
    info:
      path: Spike/AtlysSpike/Info.plist
      properties:
        CFBundleDisplayName: Atlys Spike
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Face ID unlocks your vault without typing your master password.
        NSHealthShareUsageDescription: Atlys copies the health data you choose into your encrypted vault on this iPhone. Nothing leaves the device.
        NSHealthUpdateUsageDescription: The test build writes synthetic step samples in the Simulator only.
        NSLocationWhenInUseUsageDescription: Atlys records the places you visit into your encrypted vault on this iPhone. Nothing leaves the device.
        NSLocationAlwaysAndWhenInUseUsageDescription: Always access lets Atlys record visits in the background, using low-power visit detection. Nothing leaves the device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATLYS_BUNDLE_ID_PREFIX).spike
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: AtlysCore
      - package: AtlysCollectors
  AtlysSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Spike/AtlysSpikeTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATLYS_BUNDLE_ID_PREFIX).spike.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AtlysSpike
      - package: AtlysCore
      - package: AtlysCollectors
schemes:
  AtlysSpike:
    build:
      targets:
        AtlysSpike: all
    test:
      gatherCoverageData: false
      targets:
        - AtlysSpikeTests
  Atlys:
    build:
      targets:
        Atlys: all
    test:
      gatherCoverageData: false
      targets:
        - AtlysTests
        - AtlysUITests
        - package: AtlysCore/AtlysCoreTests
        - package: AtlysCollectors/AtlysCollectorsTests
