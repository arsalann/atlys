[workspace]
resolver = "3"
members = [
    "crates/atlys-crypto",
    "crates/atlys-vault",
    "crates/atlys-adm",
    "crates/atlys-ffi",
    "tools/uniffi-bindgen",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/arsalann/atlys"
publish = false

[workspace.dependencies]
atlys-adm = { path = "crates/atlys-adm" }
atlys-crypto = { path = "crates/atlys-crypto" }
atlys-vault = { path = "crates/atlys-vault" }

argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
hpke = { version = "0.14", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
thiserror = "2"
uniffi = "0.32"
zeroize = { version = "1.9", features = ["derive"] }

hex = "0.4"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Argon2 is unusably slow without optimizations, which makes debug test runs
# take minutes. Optimize the crypto dependencies even in dev builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
